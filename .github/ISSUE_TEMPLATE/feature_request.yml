name: Feature request
description: Propose a capability or improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem does this address, or what's currently missing?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: What would this look like, at a high level? Implementation detail is not required.
    validations:
      required: false

  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: How would we know this is done and working?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility / scope considerations
      description: Any public API, package, or workflow impact you're aware of.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
