name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **This is a public issue form — anything you submit here is visible immediately.**

        **Do not paste secrets, tokens, credentials, or private customer data into this
        form.**

        **Do not use this public form to disclose a suspected vulnerability, exploit
        details, or other sensitive security information.** This repository currently
        has no private vulnerability-reporting channel, so there is no way to submit
        that kind of report confidentially here.

        If the problem can be described as a non-sensitive symptom or behavior (no
        exploit path, secret, or vulnerability detail), report it normally below.

        See [SECURITY.md](https://github.com/TarasovArtem/qa-ai-agent/blob/main/SECURITY.md)
        for this project's security, privacy, and AI data-governance architecture — it
        does not describe a vulnerability-reporting process.

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What went wrong?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps, as minimal as possible.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Core QA Agent
        - Requirements / Test Design
        - Providers / Destinations
        - Packaging / Installation
        - CI / Tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, OS, browser (if relevant), package version.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or evidence
      description: Paste any relevant output. Redact anything sensitive first.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
    validations:
      required: false
