name: Dependency Review

# CRW1-D / B-3 (Supply-Chain Monitoring): flags NEW vulnerabilities a PR's
# own dependency-manifest diff would introduce. Distinct from
# supply-chain-audit.yml, which monitors the already-committed lockfile's
# existing known advisories over time - this job only ever looks at what a
# specific PR's own package.json/package-lock.json diff newly adds, so it
# never blocks on pre-existing, already-reviewed debt. A docs-only or
# workflow-only PR never touches these paths and never triggers this job.
on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  pull-requests: write # required by comment-summary-in-pr: always, below

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
